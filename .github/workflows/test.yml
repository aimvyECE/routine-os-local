name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:dom
      - run: python3 build_standalone.py
      - run: git diff --exit-code -- RoutineOS.html
